name: Scheduled Portfolio News Email Dispatch

on:
  schedule:
    # Runs every 3 hours every day
    - cron: '0 */3 * * *'
  # Allows manual triggering from GitHub Actions UI anytime
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (logs output without sending emails or updating Firestore)'
        required: false
        type: boolean
        default: false
      target_user:
        description: 'Optional single username to test'
        required: false
        type: string
        default: ''

jobs:
  dispatch-news-emails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Portfolio News Email Dispatcher
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.target_user }}" ]; then
            FLAGS="$FLAGS --user ${{ github.event.inputs.target_user }}"
          fi
          python send_portfolio_news_emails.py $FLAGS
